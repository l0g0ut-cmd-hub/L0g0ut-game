name: Fetch FX (cgheven)
on:
  push:
    branches: [fx-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Discover pages
        run: |
          mkdir -p out/html
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for q in aura energy burst shockwave shield teleport portal tornado lightning fire campfire smoke magic slash; do
            curl -sL -A "$UA" "https://cgheven.com/?s=$q" -o "out/html/search_$q.html" || true
          done
          for p in assets/vfx/ assets/shockwave-smoke-03-closeup assets/magic-portal-02-vdb assets/lightning-arc-02-glow sitemap.xml sitemap_index.xml wp-sitemap.xml robots.txt; do
            f=$(echo "$p" | tr '/' '_'); curl -sL -A "$UA" "https://cgheven.com/$p" -o "out/html/$f.html" || true
          done
          ls -la out/html
      - name: Publish to fx-out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out; git init -q; git checkout -q -b fx-out
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "fx $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" fx-out
