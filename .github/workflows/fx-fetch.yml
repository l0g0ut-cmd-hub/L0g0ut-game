name: Fetch FX (cgheven)
on:
  push:
    branches: [fx-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download free itch.io music (Megumi Ryu, Japanese loops)
        run: |
          set -u
          mkdir -p out/pages out/files
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          J=cookies.txt
          curl -sL -A "$UA" -c $J -b $J "https://megumi-ryu.itch.io" -o out/pages/index.html
          grep -oE 'https://megumi-ryu\.itch\.io/[a-z0-9-]+' out/pages/index.html | sort -u > out/pages/all.txt
          grep -iE 'japan|town|tanuki|oinari|folklore|festival|edo|kyoto|tea|shrine' out/pages/all.txt > out/pages/pick.txt || true
          cat out/pages/pick.txt | tee -a out/log.txt
          for p in $(cat out/pages/pick.txt | head -14); do
            n=$(basename "$p")
            curl -sL -A "$UA" -c $J -b $J "$p" -o "out/pages/$n.html"
            csrf=$(grep -oE 'name="csrf_token" value="[^"]+"' "out/pages/$n.html" | head -1 | sed 's/.*value="//;s/"$//')
            [ -z "$csrf" ] && csrf=$(grep -oE '"csrf_token":"[^"]+"' "out/pages/$n.html" | head -1 | sed 's/.*:"//;s/"$//')
            # бесплатная загрузка: страница загрузок (download_url) → ссылки на файлы
            dl=$(curl -sL -A "$UA" -c $J -b $J -X POST -d "csrf_token=$csrf" "$p/download_url")
            echo "$n download_url: $(echo "$dl" | head -c 200)" >> out/log.txt
            durl=$(echo "$dl" | grep -oE '"url":"[^"]+"' | head -1 | sed 's/"url":"//;s/"$//;s#\\/#/#g')
            [ -z "$durl" ] && continue
            curl -sL -A "$UA" -c $J -b $J "$durl" -o "out/pages/$n.dl.html"
            csrf2=$(grep -oE 'name="csrf_token" value="[^"]+"' "out/pages/$n.dl.html" | head -1 | sed 's/.*value="//;s/"$//')
            for u in $(grep -oE 'data-upload_id="[0-9]+"' "out/pages/$n.dl.html" | grep -oE '[0-9]+' | sort -u); do
              base=$(echo "$durl" | sed 's#/download/.*##')
              key=$(echo "$durl" | grep -oE '/download/[^?]+' | sed 's#/download/##')
              r=$(curl -sL -A "$UA" -c $J -b $J -X POST -d "csrf_token=$csrf2" "$base/file/$u?key=$key&source=game_download")
              fu=$(echo "$r" | grep -oE '"url":"[^"]+"' | head -1 | sed 's/"url":"//;s/"$//;s#\\/#/#g')
              echo "$n upload $u -> ${fu:0:120}" >> out/log.txt
              [ -n "$fu" ] && curl -sL -A "$UA" --max-filesize 300000000 "$fu" -o "out/files/${n}_$u.bin"
            done
          done
          cd out/files; for f in *.bin; do [ -f "$f" ] || continue; file "$f" >> ../log.txt; done
          mkdir -p ../audio
          for f in *.bin; do
            [ -f "$f" ] || continue
            if file "$f" | grep -qi zip; then mkdir -p "x_$f"; unzip -q -o "$f" -d "x_$f"; fi
          done
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          find . -type f \( -iname '*.mp3' -o -iname '*.ogg' -o -iname '*.wav' \) | while read a; do
            o="../audio/$(echo "$a" | sed 's#^\./##; s#[/ ]#_#g').ogg"
            ffmpeg -v error -y -i "$a" -vn -ac 2 -ar 44100 -c:a libvorbis -q:a 5 "$o" && echo "OK $a" >> ../log.txt
          done
          cd ..; rm -rf files pages/*.html
          ls -la audio >> log.txt; du -sh audio
      - name: Publish to fx-out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out; git init -q; git checkout -q -b fx-out
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "fx $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" fx-out
