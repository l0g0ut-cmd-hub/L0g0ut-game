name: Проверка синтаксиса C#

# Быстрая проверка перед сборкой APK (~1 мин): mcs --parse по всем скриптам проекта (только синтаксис, без типов Unity).
on:
  workflow_dispatch:
  push:
    branches: [cs-check]

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mcs
        # зеркала apt иногда зависают: каждая попытка не дольше 2 минут, три попытки
        run: |
          for i in 1 2 3; do
            timeout 120 sudo apt-get -o Acquire::Retries=2 update -qq && timeout 180 sudo apt-get install -y -qq mono-mcs >/dev/null && break
            echo "попытка $i не удалась"; sleep 5
          done
          which mcs
      - name: Parse
        run: |
          find Assets -name "*.cs" -not -path "*/Plugins/*" > cs.txt
          wc -l cs.txt
          mcs --parse @cs.txt
