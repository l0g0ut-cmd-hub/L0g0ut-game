name: Поиск готовых тэнгу Meshy
on:
  push:
    branches: [meshy-probe]
permissions: {}
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Найти задачи отрядов в аккаунтах Meshy
        env:
          ACCOUNT_1: ${{ secrets.MESHY_KEY }}
          ACCOUNT_2: ${{ secrets.MESHY_KEY2 }}
          ACCOUNT_3: ${{ secrets.MESHY_KEY_2 }}
          ACCOUNT_4: ${{ secrets.MESHY2 }}
          ACCOUNT_5: ${{ secrets.MESHY_API_KEY }}
          ACCOUNT_6: ${{ secrets.MESHY_KEY_SECOND }}
          ACCOUNT_7: ${{ secrets.MESHY_KEY2_API }}
          ACCOUNT_8: ${{ secrets.MESHY_SECOND_KEY }}
          ACCOUNT_9: ${{ secrets.MESHY_2 }}
          ACCOUNT_10: ${{ secrets.MESHY_KEY3 }}
          ACCOUNT_11: ${{ secrets.MESHY_KEY4 }}
          ACCOUNT_12: ${{ secrets.MESHY_KEY5 }}
          ACCOUNT_13: ${{ secrets.MESHY_KEY6 }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          seen = set()
          for slot, key in sorted(os.environ.items()):
              if not slot.startswith("ACCOUNT_") or not key or key in seen:
                  continue
              seen.add(key)
              for kind in ("v1/image-to-3d", "v2/text-to-3d", "v1/multi-image-to-3d"):
                  count = matches = 0
                  previous = None
                  for page in range(1, 101):
                      url = f"https://api.meshy.ai/openapi/{kind}?page_num={page}&page_size=50"
                      req = urllib.request.Request(url, headers={"Authorization":"Bearer " + key})
                      try:
                          with urllib.request.urlopen(req, timeout=30) as response:
                              rows = json.load(response)
                      except urllib.error.HTTPError as exc:
                          print(slot, kind, "HTTP", exc.code)
                          break
                      if isinstance(rows, dict):
                          rows = rows.get("result", rows.get("data", []))
                      if not rows or rows[0].get("id") == previous:
                          break
                      previous = rows[0].get("id")
                      for row in rows:
                          count += 1
                          desc = " ".join(str(row.get(f) or "") for f in ("name","title","task_name","prompt","texture_prompt","model_name","file_name","image_url")).lower()
                          if row.get("status") == "SUCCEEDED" and any(w in desc for w in ("tengu","тэнгу","тенгу","天狗")):
                              print("MATCH",slot,kind,row["id"])
                              matches += 1
                      if len(rows) < 50:
                          break
                  print(slot, kind, "tasks", count, "matches", matches)
          print("Accounts checked", len(seen))
