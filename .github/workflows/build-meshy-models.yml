name: Build Meshy models

# Blender on the runner: Meshy GLB (tools/models/meshy) → rigged FBX + albedo + previews.
# Results go to the meshy-models branch; they are copied into Assets after review.
on:
  workflow_dispatch:
  push:
    branches: [meshy-build]

permissions:
  contents: write

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender 4.2 LTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 libegl1 >/dev/null
          curl -sSfL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.2.3-linux-x64" >> "$GITHUB_PATH"

      - name: Build rigged models
        run: |
          set -e
          mkdir -p out/Models out/Art out/preview
          build() {
            MESHY_GLB="$( [ -f tools/models/meshy/$1_rig.fbx ] && echo tools/models/meshy/$1_rig.fbx || echo tools/models/meshy/$1.glb )" MESHY_NAME="$2" MESHY_OUT=out/Models \
            BODY_H="$3" TOP_FRAC="$4" ARM_PAD="$5" SHOULDER_X="$6" HEAD_Z="${7:-0}" \
              blender -b --factory-startup --python tools/blender/build_meshy_char.py > "out/$2.log" 2>&1 || true
            grep -E "^MZ|Error|Traceback" "out/$2.log" | head -60
            test -f "out/Models/$2.fbx" || { tail -60 "out/$2.log"; exit 1; }
            mv out/Models/$2_*.png out/preview/ 2>/dev/null || true
            rm -f out/Models/$2.blend out/Models/$2.blend1
          }
          build akiko  Akiko_Player 1.68 0.975 0.00 0.16
          build oni    Oni_Enemy    1.82 0.955 0.02 0.19
          build shogun Shogun_Enemy 1.74 0.925 0.06 0.18
          build fallen Fallen_Enemy 1.74 0.935 0.03 0.18
          build shadow Shadow_Enemy 1.74 0.990 0.00 0.17
          build dzin   Dzin_Player  1.72 0.957 0.02 0.17 1.56
          build ren    Ren_Player   1.70 0.930 0.00 0.16 1.60

      - name: Extract textures
        run: |
          python3 -m pip install -q pillow
          tex() {
            if [ -f "tools/models/meshy/$1_rig_albedo.jpg" ]; then
              n=$(echo "$2" | tr 'A-Z' 'a-z'); mkdir -p "out/Art/$2"; cp "tools/models/meshy/$1_rig_albedo.jpg" "out/Art/$2/${n}_albedo.jpg"
            else python3 tools/meshy_textures.py "tools/models/meshy/$1.glb" "$2" out/Art; fi
          }
          tex akiko Akiko
          tex oni Oni
          tex shogun Shogun
          tex fallen Fallen
          tex shadow Shadow
          tex dzin Dzin
          tex ren Ren

      - name: Publish to meshy-models branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          D="$RUNNER_TEMP/models"; rm -rf "$D"; mkdir -p "$D"
          cp -r out/. "$D/"
          cd "$D"
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA}" > info.txt
          git init -q; git checkout -q -b meshy-models
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "meshy models run ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" meshy-models
