name: Combat QA (Play Mode)

# Автотест боя без сборки APK: Unity в Play Mode гоняет CombatQA (облики, хват, удары, прыжок, серии, фантом клинка).
# Результат (qa.txt + кадры) — в ветку qa-results. Запуск: пуш в ветку qa или вручную.
on:
  workflow_dispatch:
  push:
    branches: [qa]

# то же место лицензии, что и у сборки APK: в очередь, а не параллельно
concurrency:
  group: build-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_VERSION: 6000.0.36f1
      GAMECI_VERSION: v0.1.72
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ github.sha }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      - name: Install GameCI CLI
        run: |
          set -o pipefail
          export GAME_CI_INSTALL="$RUNNER_TEMP/game-ci/bin"
          mkdir -p "$GAME_CI_INSTALL"
          curl -fsSL "https://raw.githubusercontent.com/game-ci/cli/${GAMECI_VERSION}/scripts/install.sh" -o "$RUNNER_TEMP/gc-install.sh"
          bash "$RUNNER_TEMP/gc-install.sh" "$GAMECI_VERSION" "$GAME_CI_INSTALL"
          echo "$GAME_CI_INSTALL" >> "$GITHUB_PATH"

      - name: Run combat QA in Play Mode
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -o pipefail
          game-ci build . \
            --engine unity \
            --engine-version "$UNITY_VERSION" \
            --target-platform Android \
            --build-name BladePathQA \
            --versioning-strategy None \
            --manual-exit \
            --build-method BladePath.EditorTools.QARunner.Run 2>&1 | tee "$RUNNER_TEMP/qa.log"

      - name: Publish results to qa-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          D="$RUNNER_TEMP/qadrop"; rm -rf "$D"; mkdir -p "$D"
          if [ -d "$GITHUB_WORKSPACE/build/qa" ]; then sudo cp -r "$GITHUB_WORKSPACE/build/qa/." "$D/"; sudo chown -R "$(id -u)" "$D"; fi
          # хвост лога Unity без секретов: строки QA|, ошибки компиляции и исключения
          python3 - "$RUNNER_TEMP/qa.log" "$D/unity_log_tail.txt" <<'PY'
          import os, sys
          src, dst = sys.argv[1], sys.argv[2]
          s = open(src, errors='replace').read() if os.path.exists(src) else '(лога нет)'
          for k in ('UNITY_PASSWORD', 'UNITY_EMAIL'):
              v = os.environ.get(k)
              if v: s = s.replace(v, '***')
          lines = s.splitlines()
          keep = [l for l in lines if 'QA' in l or 'error' in l.lower() or 'exception' in l.lower()]
          open(dst, 'w').write('\n'.join(keep[-1500:] + ['', '----- хвост -----', ''] + lines[-400:]))
          PY
          cd "$D"
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA}" > info.txt
          git init -q; git checkout -q -b qa-results
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "qa run ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" qa-results
