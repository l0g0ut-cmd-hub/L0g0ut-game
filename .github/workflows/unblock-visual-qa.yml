name: Unblock queued Android visual QA
on:
  push:
    branches: [ci-unblock]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  clear-stuck-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only stalled Unity Play Mode run 20
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_RUN: "42089221898"
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OLD_RUN" --jq '.status')
          echo "Unity QA #20 current state: $status"
          if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "pending" ]; then
            # Normal cancellation was accepted but the stuck GameCI process remained in_progress.
            # Force-cancel this one known old run only; do not touch APK or the Android QA run.
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$OLD_RUN/force-cancel" >/dev/null
            echo "Force-cancel requested for stalled Unity QA #20; APK #433 and Android test #4 untouched"
          else
            echo "Old run already finished; no cancellation needed"
          fi
          echo "Queued Android Smoke: https://github.com/$GITHUB_REPOSITORY/actions/runs/42093130814"
